image: harbor.jibit.cloud/library/docker:stable
stages:
  - build
  - push
  - security

include:
  - project: 'platform/shared-ci'
    ref: 'master'
    file:
      - '/secops/trivy/trivy.yml'
      - '/secops/trivy/trivy-report.yml'

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_HOST: tcp://$DOCKER:2375
  CI_REGISTRY_IMAGE: iris

before_script:
  - VERSION=$(awk '/^## \[/{ sub(/^## \[/,""); sub(/\].*/,""); print; exit }' CHANGELOG.md)
  - |
    if [ -z "$VERSION" ] || [ "$VERSION" = "Unreleased" ]; then
      VERSION=develop
    fi
  - export IMAGE_TAG=$BASE_IMAGE/$CI_REGISTRY_IMAGE:$VERSION
  - export COMMIT_TAG=$BASE_IMAGE/$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
  - export LATEST_TAG=$BASE_IMAGE/$CI_REGISTRY_IMAGE:latest

lint_web:
  stage: build
  image:
    name: harbor.jibit.cloud/library/chainguard/node:latest-dev
    # Chainguard node image entrypoint is `node`; clear it so the runner gets a shell.
    entrypoint: [""]
  before_script: []
  script:
    - cd web
    - npm ci
    - npm run lint
    - CI=true npm test -- --watchAll=false
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

build_push:
  stage: build
  script:
    - echo "Building version $VERSION"
    - echo "Image tags $IMAGE_TAG, $COMMIT_TAG, $LATEST_TAG"
    - docker build -t $IMAGE_TAG -t $COMMIT_TAG  -t $LATEST_TAG .
    - docker push $IMAGE_TAG
    - docker push $COMMIT_TAG
    - docker push $LATEST_TAG
  only:
    - main